server:
  port: 8081

spring:
  application:
    name: user-service
  # Default profile uses an in-memory H2 database so the whole stack runs with zero external
  # dependencies. Switch to the "prod" profile (below) for MySQL.
  profiles:
    active: dev
  jpa:
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-256bit}
    issuer: interview-experience-portal
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

# Seed a demo admin on first boot (dev convenience only).
app:
  seed:
    admin-email: admin@interviewportal.dev
    admin-username: admin
    admin-password: Admin@12345

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.interviewportal: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userdb}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Connection pooling is critical at scale: reuse a bounded set of DB connections instead of
      # opening one per request. Size ~= (core_count * 2) per instance; tune with load testing.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate   # In prod, schema is managed by migrations (e.g. Flyway), not Hibernate.
    open-in-view: false
