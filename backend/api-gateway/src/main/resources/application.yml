server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Global CORS so the Angular dev server (localhost:4200) can call the API.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # Static routing. Eureka is intentionally NOT used (see README): with a small, fixed set of
      # services, static routes + client-side/DNS load balancing are simpler and have fewer moving
      # parts. Service discovery becomes worthwhile only with many, frequently-changing instances.
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: interview-service
          uri: ${INTERVIEW_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/interviews/**,/api/admin/**

# Shared JWT secret. In production inject via environment variable / secret manager.
security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-256bit}
    issuer: interview-experience-portal

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.interviewportal: INFO
